# Competitors to monitor
# The crawler will:
#   1. Try to fetch /sitemap.xml from each website
#   2. Follow internal links starting from seed_urls (or homepage if none given)
#   3. Respect max_depth to limit crawl scope
#   4. Use LLM to filter only educationally relevant pages
#
# You can optionally pin specific URLs that must always be crawled.

competitors:
  - name: Amity University
    website: https://www.amity.edu
    active: true
    max_depth: 2
    seed_urls:
      - https://www.amity.edu/programmes/
      - https://www.amity.edu/admission/
    pinned_urls: []  # Optional: always crawl these exact URLs

